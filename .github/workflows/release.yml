# Purpose: Publish a GitHub release and, when npm trusted publishing is configured, the public npm package for a v* tag.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run release:check
      - run: npm pack
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: jev-rerank-*.tgz
      - name: Publish npm package with provenance
        if: ${{ vars.NPM_PUBLISH_ENABLED == 'true' }}
        run: npm publish
